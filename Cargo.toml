[workspace]
resolver = "2"
members = ["crates/vrc-audio", "crates/vrc-vr", "crates/vrc-stereo", "crates/vrc-scene", "crates/vrc-map", "crates/vrc-players", "crates/vrc-nav", "crates/vrc-bridge", "crates/vr-probe", "tools/hrtf-render"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/xkeyC/astrbot_vrchat_bridge"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
jpeg-encoder = "0.6"
memmap2 = "0.9"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vrc-audio = { path = "crates/vrc-audio" }
vrc-map = { path = "crates/vrc-map" }
vrc-nav = { path = "crates/vrc-nav" }
vrc-players = { path = "crates/vrc-players" }
vrc-scene = { path = "crates/vrc-scene" }
vrc-stereo = { path = "crates/vrc-stereo" }
vrc-vr = { path = "crates/vrc-vr" }

# SGM loops are hot even in tests and probes run on the server: optimise them.
[profile.dev.package.vrc-stereo]
opt-level = 3

[profile.dev.package.vrc-scene]
opt-level = 3

[profile.dev.package.vrc-map]
opt-level = 3

[profile.dev.package.vrc-audio]
opt-level = 3

